# BuildKit daemon config, dev only.
# Loaded by the `ploydok-dev` Docker buildx builder that `make infra-up`
# creates (driver docker-container, network=ploydok_ploydok). It declares the local dev
# registry as insecure (plain HTTP, no TLS) so builds can push to it.
# `registry:5000` resolves because the builder joins the compose network.

# Snapshotter: kernel-native overlayfs, no fuse needed. Override with
# `snapshotter = "native"` on kernels older than 5.13.
[worker.oci]
  enabled = true
  snapshotter = "overlayfs"
  gc = true

  # Reclaim unused cache older than seven days above a small warm cache.
  [[worker.oci.gcpolicy]]
    keepDuration = "168h"
    maxUsedSpace = "512MB"

  # Bound reclaimable cache on small VPS disks, including shared records.
  # Active builds may temporarily exceed these GC targets.
  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "512MB"
    maxUsedSpace = "3GB"
    minFreeSpace = "2GB"

[registry."registry:5000"]
  http = true
  insecure = true

[registry."127.0.0.1:5000"]
  http = true
  insecure = true
