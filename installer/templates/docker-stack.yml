# SPDX-License-Identifier: AGPL-3.0-only
#
# Ploydok control-plane Swarm stack.
#
# Used by `docker stack deploy -c docker-stack.yml ploydok` on hosts that
# joined a Swarm (single-node is fine: `docker swarm init`). Replaces the
# legacy compose file for production deployments. The compose template
# remains for local dev (`make infra-up`) where Swarm features are unwanted.
#
# Differences vs docker-compose.yml:
#   - `deploy:` directives drive replicas, rolling updates and restarts
#     (Swarm ignores top-level `restart:`).
#   - Caddy publishes 80/443 in mode: host so ACME's same-source-IP rule
#     still works (the Swarm routing-mesh would otherwise NAT inbound
#     traffic to a random task).
#   - web runs with replicas: 2 + start-first updates. API stays at one task
#     while its WebAuthn/setup challenge state is process-local.
#   - postgres / redis / registry / agent / buildkitd / caddy stay at
#     replicas: 1 (stateful or singleton).
#   - Watchtower is gone. It is replaced by `ploydok-update.timer` on the host.

version: "3.8"

services:
  api:
    image: ${PLOYDOK_API_IMAGE}
    user: "${PLOYDOK_RUNTIME_UID}:${PLOYDOK_RUNTIME_GID}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    env_file: ${PLOYDOK_DATA_DIR}/.env
    volumes:
      - ${PLOYDOK_DATA_DIR}/logs:/var/log/ploydok
      - ${PLOYDOK_DATA_DIR}/builds:/var/lib/ploydok/builds
      - ${PLOYDOK_DATA_DIR}/static:/var/lib/ploydok/static
      - ${PLOYDOK_DATA_DIR}/backups/control-plane.configured:/var/lib/ploydok/backups/control-plane.configured:ro
      - ${PLOYDOK_DATA_DIR}/backups/control-plane.last-success:/var/lib/ploydok/backups/control-plane.last-success:ro
      - ${PLOYDOK_DATA_DIR}/backups/control-plane.last-failure:/var/lib/ploydok/backups/control-plane.last-failure:ro
      - ${PLOYDOK_DATA_DIR}/pki/ca.pem:/var/lib/ploydok/pki/ca.pem:ro
      - ${PLOYDOK_DATA_DIR}/pki/client.pem:/var/lib/ploydok/pki/client.pem:ro
      - ${PLOYDOK_DATA_DIR}/pki/client.key:/var/lib/ploydok/pki/client.key:ro
      - ${PLOYDOK_DATA_DIR}/agent:/run/ploydok
    networks:
      - ploydok
      - ploydok-management
      - ploydok-build
      - ploydok-monitoring
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:3335/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      # WebAuthn challenges and first-boot state are process-local today.
      # Keep one API task until that state is moved to Redis.
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
        delay: 5s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      labels:
        ploydok.kind: infra
        ploydok.component: api

  web:
    image: ${PLOYDOK_WEB_IMAGE}
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      PLOYDOK_API_URL: http://api:3335
    networks:
      - ploydok
    healthcheck:
      # Anonymous root requests redirect to login/setup; redirects are healthy.
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/',{redirect:'manual'});process.exit(r.status>=200&&r.status<400?0:1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
        delay: 5s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      labels:
        ploydok.kind: infra
        ploydok.component: web

  agent:
    image: ${PLOYDOK_AGENT_IMAGE}
    environment:
      PLOYDOK_AGENT_ADDR: 0.0.0.0:50051
      PLOYDOK_AGENT_PKI_DIR: /var/lib/ploydok/pki
      PLOYDOK_VALIDATOR_CONFIG: /etc/ploydok/validator.toml
      PLOYDOK_HOST_STATS_PATH: /var/lib/ploydok/host-data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PLOYDOK_DATA_DIR}/agent:/run/ploydok
      - ${PLOYDOK_DATA_DIR}/volumes:/var/lib/ploydok/volumes
      - ${PLOYDOK_DATA_DIR}/app-volumes:/var/lib/ploydok/app-volumes
      - ${PLOYDOK_DATA_DIR}/static:/var/lib/ploydok/static
      - ${PLOYDOK_DATA_DIR}/config:/etc/ploydok:ro
      - ${PLOYDOK_DATA_DIR}/pki/ca.pem:/var/lib/ploydok/pki/ca.pem:ro
      - ${PLOYDOK_DATA_DIR}/pki/server.pem:/var/lib/ploydok/pki/server.pem:ro
      - ${PLOYDOK_DATA_DIR}/pki/server.key:/var/lib/ploydok/pki/server.key:ro
      - ${PLOYDOK_DATA_DIR}/keys:/var/lib/ploydok/keys
      - ${PLOYDOK_DATA_DIR}/data:/var/lib/ploydok/host-data:ro
    networks:
      - ploydok
    deploy:
      mode: global
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: agent

  caddy:
    image: ${PLOYDOK_CADDY_IMAGE}
    labels:
      ploydok.kind: infra
      ploydok.component: caddy
    volumes:
      - ${PLOYDOK_INSTALL_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-admin-socket:/run/caddy-admin
      - caddy-data:/data
      - caddy-config:/config
      - ${PLOYDOK_DATA_DIR}/static:/var/lib/ploydok/static:ro
    ports:
      - target: 80
        published: ${PLOYDOK_HTTP_PUBLISHED_PORT}
        protocol: tcp
        mode: host
      - target: 443
        published: ${PLOYDOK_HTTPS_PUBLISHED_PORT}
        protocol: tcp
        mode: host
    networks:
      - ploydok
      - ploydok-public
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: caddy

  # The public Caddy process exposes its admin API only through a Unix socket.
  # This bridge is the sole TCP entrypoint and is deliberately absent from
  # ploydok-public, so managed workloads cannot mutate global ingress state.
  caddy-admin:
    image: ${PLOYDOK_CADDY_IMAGE}
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/CaddyAdminProxyfile
      - --adapter
      - caddyfile
    volumes:
      - ${PLOYDOK_INSTALL_DIR}/CaddyAdminProxyfile:/etc/caddy/CaddyAdminProxyfile:ro
      - caddy-admin-socket:/run/caddy-admin
    networks:
      - ploydok-management
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: caddy-admin

  adminer:
    image: ${PLOYDOK_ADMINER_IMAGE}
    networks:
      - ploydok
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: adminer

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ploydok
      POSTGRES_PASSWORD: ${PLOYDOK_PG_PASSWORD}
      POSTGRES_DB: ploydok
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ploydok
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: postgres

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - "redis-server"
      - "--requirepass"
      - "${PLOYDOK_REDIS_PASSWORD}"
      - "--appendonly"
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      - ploydok
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: redis

  registry:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    networks:
      - ploydok
      - ploydok-build
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: registry

  buildkitd:
    # NOTE: Swarm silently ignores `security_opt`, so the rootless BuildKit
    # image can't get its seccomp relaxations and crashes. The non-rootless
    # image runs as root inside the container and works under Swarm without
    # any extra security flags. Acceptable trade-off here since the entire
    # BuildKit is isolated on a non-attachable API/Registry-only overlay below.
    # The overlay keeps egress enabled so BuildKit can pull public base images.
    image: moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5
    command:
      - --addr
      - tcp://0.0.0.0:1234
      - --config
      - /etc/buildkit/buildkitd.toml
    volumes:
      - buildkit-cache:/var/lib/buildkit
      - ${PLOYDOK_DATA_DIR}/config/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    networks:
      - ploydok-build
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: buildkitd

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ${PLOYDOK_DATA_DIR}/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PLOYDOK_DATA_DIR}/config/ploydok-alerts.yml:/etc/prometheus/rules/ploydok-alerts.yml:ro
      - ${PLOYDOK_DATA_DIR}/secrets/metrics-token:/run/ploydok-secrets/metrics-token:ro
      - prometheus-data:/prometheus
    networks:
      - ploydok-monitoring
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: prometheus

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${PLOYDOK_DATA_DIR}/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${PLOYDOK_DATA_DIR}/secrets/alert-webhook-url:/run/ploydok-secrets/alert-webhook-url:ro
      - alertmanager-data:/alertmanager
    networks:
      - ploydok-monitoring
      - ploydok-alerting
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        ploydok.kind: infra
        ploydok.component: alertmanager

networks:
  ploydok:
    driver: overlay
    attachable: true
  ploydok-public:
    name: ploydok-public
    driver: overlay
    attachable: true
  ploydok-management:
    driver: overlay
    internal: true
    attachable: false
  ploydok-build:
    driver: overlay
    internal: false
    attachable: false
  ploydok-monitoring:
    driver: overlay
    internal: true
    attachable: false
  ploydok-alerting:
    driver: overlay
    internal: false
    attachable: false

volumes:
  caddy-data:
  caddy-config:
  caddy-admin-socket:
  postgres-data:
  redis-data:
  registry-data:
  buildkit-cache:
  prometheus-data:
  alertmanager-data:
