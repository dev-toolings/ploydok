name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    # Develop deployments use local Deploy Shuttle until the official release.
    if: github.ref != 'refs/heads/develop'
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check SPDX headers
        run: bun run check:spdx

      - name: Check migration inventory
        run: bun run check:migrations

      - name: Check Markdown links
        run: bun run check:markdown

      - name: Reject placeholder test claims
        run: bun run check:test-placeholders

      - name: Audit JavaScript dependencies and verify triage
        run: bun run audit:dependencies

      # One turbo invocation so the three task graphs run concurrently and share
      # a single cache read, instead of three sequential cold starts.
      - name: Type check, lint and test
        run: bunx turbo run typecheck lint test

  postgres-integration:
    if: github.ref != 'refs/heads/develop'
    name: Critical PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: ploydok
          POSTGRES_PASSWORD: ploydok-ci
          POSTGRES_DB: ploydok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ploydok -d ploydok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://ploydok:ploydok-ci@127.0.0.1:5432/ploydok_test
      PLOYDOK_TEST_PG_URL: postgres://ploydok:ploydok-ci@127.0.0.1:5432/ploydok_test
      REDIS_URL: redis://127.0.0.1:6379/0
      PLOYDOK_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations to isolated database
        run: bun run --cwd packages/db migrate

      - name: Test database package without skips
        run: |
          set -o pipefail
          bun test packages/db/src 2>&1 | tee /tmp/ploydok-db-tests.log
          if grep -Eq '(^|[[:space:]])[1-9][0-9]* skip(ped)?([[:space:]]|$)' /tmp/ploydok-db-tests.log; then
            echo "critical database tests were skipped" >&2
            exit 1
          fi

      - name: Test critical API database boundaries without skips
        run: |
          set -Eeuo pipefail
          tests=(
            apps/api/src/auth/middleware.test.ts
            apps/api/src/auth/second-factor.test.ts
            apps/api/src/routes/auth.test.ts
            apps/api/src/routes/apps-env.test.ts
            apps/api/src/routes/apps-domains.test.ts
            apps/api/src/routes/invitations.test.ts
            apps/api/src/routes/memberships.test.ts
            apps/api/src/security/invitations-rate-limit.test.ts
            apps/api/src/worker/outbox-dispatcher.test.ts
            apps/api/src/worker/queue-outbox.e2e.test.ts
            apps/api/src/worker/queue-trust.e2e.test.ts
          )
          : >/tmp/ploydok-api-pg-tests.log
          for test_file in "${tests[@]}"; do
            bun test "$test_file" 2>&1 | tee -a /tmp/ploydok-api-pg-tests.log
          done
          if grep -Eq '(^|[[:space:]])[1-9][0-9]* skip(ped)?([[:space:]]|$)' /tmp/ploydok-api-pg-tests.log; then
            echo "critical API database tests were skipped" >&2
            exit 1
          fi
