name: Installer

on:
  pull_request:
    branches:
      - main
    paths:
      - "installer/**"
      - "project-docs/operations/install/**"
      - "apps/docs/src/pages/project-docs/operations/install.mdx"
      - "apps/docs/src/lib/nav.ts"
      - ".github/workflows/installer.yml"
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - "project-docs/operations/install/**"
      - "apps/docs/src/pages/project-docs/operations/install.mdx"
      - "apps/docs/src/lib/nav.ts"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

jobs:
  dry-run:
    if: github.ref != 'refs/heads/develop'
    name: Dry-run installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install shell dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Shell syntax
        run: bash -n installer/install.sh installer/ploydok-cli installer/tests/run.sh

      - name: Installer scenarios
        run: bash installer/tests/run.sh
